name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # Workload Identity Federation — no JSON keys

env:
  GOOGLE_CLOUD_PROJECT: ouroboros-507503
  OUROBOROS_REGION: us-central1

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        run: |
          uv run mypy --strict packages
          uv run mypy config

      - name: Test (offline — recorded fixtures only)
        run: uv run pytest -m "not live"

  terraform:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/492372502792/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: sa-ci-deploy@ouroboros-507503.iam.gserviceaccount.com

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"

      - name: terraform init
        working-directory: infra
        run: terraform init

      - name: terraform validate
        working-directory: infra
        run: terraform validate

      - name: terraform plan
        working-directory: infra
        run: terraform plan -var-file=environments/dev.tfvars -no-color
