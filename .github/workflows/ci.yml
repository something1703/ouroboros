name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # Workload Identity Federation — no JSON keys

env:
  GOOGLE_CLOUD_PROJECT: ouroboros-507503
  OUROBOROS_REGION: us-central1

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # Backs the packages/ledger integration tests (PHASE_02.md §2.2: "local postgres
    # in CI via service container"). Credentials match docker-compose.yml exactly so
    # local and CI runs behave the same.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ouroboros
          POSTGRES_USER: app
          POSTGRES_PASSWORD: localdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d ouroboros"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_NAME: ouroboros
      DB_USER: app
      DB_PASSWORD: localdev
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        run: |
          uv run mypy --strict packages
          uv run mypy --strict services
          uv run mypy config

      - name: Test (offline — recorded fixtures only)
        run: uv run pytest -m "not live"

  terraform:
    # Only on PRs: a push to main also triggers deploy.yml's terraform apply
    # against the same GCS-backed state, and both jobs starting at once was
    # racing for the state lock (see docs/DECISIONS.md #019). deploy.yml's
    # own apply is the real validation for pushes to main; this job's plan
    # is what "a PR shows a terraform plan comment" (Phase 1.5) needs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/492372502792/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: sa-ci-deploy@ouroboros-507503.iam.gserviceaccount.com

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"

      - name: terraform init
        working-directory: infra
        run: terraform init

      - name: terraform validate
        working-directory: infra
        run: terraform validate

      - name: terraform plan
        working-directory: infra
        run: terraform plan -var-file=environments/dev.tfvars -no-color
