repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy-packages
        name: mypy --strict packages
        entry: uv run mypy --strict packages
        language: system
        pass_filenames: false
        files: ^(packages|pyproject\.toml)
      - id: mypy-config
        name: mypy config
        entry: uv run mypy config
        language: system
        pass_filenames: false
        files: ^(config|pyproject\.toml)

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^(uv\.lock|\.env\.example)$

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.4
    hooks:
      - id: terraform_fmt

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^infra/
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
