[alembic]
script_location = packages/ledger/migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is intentionally absent — packages/ledger/migrations/env.py builds it
# from the same DB_HOST/DB_NAME/DB_USER/DB_PASSWORD env vars as packages/ledger/db.py,
# so a migration never drifts from what the app actually connects to.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
