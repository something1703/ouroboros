# Local dev stack. Only `postgres` is real today — everything else here is
# genuinely runnable, but the services it builds don't exist as application
# code yet. Uncomment each block as its phase lands (Phase 2.3 toolbox,
# Phase 3 ingest, Phase 3/5/8 dashboard_api, Phase 8 web) rather than leaving
# a `docker compose up` that fails on a missing Dockerfile. See docs/DEV.md.

name: ouroboros

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ouroboros
      POSTGRES_USER: app
      POSTGRES_PASSWORD: localdev # pragma: allowlist secret — local-only placeholder, not a real credential
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ouroboros"]
      interval: 5s
      timeout: 5s
      retries: 10

