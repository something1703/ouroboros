# Local dev stack. `postgres` and `toolbox` are real today — the rest of this
# file is genuinely runnable, but the services it builds don't exist as
# application code yet. Uncomment each block as its phase lands (Phase 3
# ingest, Phase 3/5/8 dashboard_api, Phase 8 web) rather than leaving a
# `docker compose up` that fails on a missing Dockerfile. See docs/DEV.md.

name: ouroboros

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ouroboros
      POSTGRES_USER: app
      POSTGRES_PASSWORD: localdev # pragma: allowlist secret — local-only placeholder, not a real credential
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ouroboros"]
      interval: 5s
      timeout: 5s
      retries: 10

  toolbox:
    build:
      context: .
      dockerfile: services/toolbox/Dockerfile
    environment:
      TOOLBOX_DB_HOST: postgres
      TOOLBOX_DB_PORT: "5432"
      TOOLBOX_DB_NAME: ouroboros
      TOOLBOX_DB_USER: app
      TOOLBOX_DB_PASSWORD: localdev # pragma: allowlist secret — local-only placeholder
    ports:
      - "5001:5000" # host 5000 is often taken by macOS AirPlay Receiver
    depends_on:
      postgres:
        condition: service_healthy

  # ingest:
  #   build: { context: ., dockerfile: services/ingest/Dockerfile }
  #   env_file: .env
  #   environment: { DB_HOST: postgres, TOOLBOX_MCP_URL: http://toolbox:5000 }
  #   ports: ["8081:8080"]
