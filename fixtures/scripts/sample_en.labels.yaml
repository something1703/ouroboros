# Hand-labelled entities for fixtures/scripts/sample_en.pdf, for the Phase 3.2
# recall test (PHASE_03.md §3.2: "≥ 90% recall against a hand-labelled list of
# 30 known entities"). This is a deliberately compact synthetic script (5 pages,
# not the plan's ideal 60-120), so the label list is proportionally smaller —
# see docs/DECISIONS.md for why a shorter synthetic fixture was used instead of
# blocking Phase 3 on the human supplying a real screenplay.
#
# Every entity below is real and should be extracted. The script also contains
# deliberate distractors that must NOT appear here and must NOT be extracted:
# "Cafe Lumiere" (explicitly fictional in the text), and the fictional
# characters Maya Chen, Priya Sharma, Albert Weiss, the Sound Engineer.

