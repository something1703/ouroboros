# SPA fallback: any path nginx can't find as a real file (every client-side route --
# /how-it-works, /docs/architecture, /app/projects/:id) serves index.html instead of
# a bare 404, so React Router's own routing takes over. Static assets keep normal
# caching; index.html is served fresh every time so a redeploy is picked up on next
# load instead of being pinned by a stale cached shell.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # nginx:1.27-alpine's stock mime.types has no entry for .mjs, so it fell back
    # to the default application/octet-stream -- browsers refuse to execute a
    # dynamically `import()`-ed ES module served with that Content-Type. Found
    # live: pdfjs-dist's worker (loaded via a dynamic import, not a <script> tag)
    # failed on every real page load with "Failed to fetch dynamically imported
    # module," breaking the Script tab entirely, while every other asset (plain
    # .js, .css) has always worked fine since those extensions ARE in the
    # default mime.types. A bare `types {}` block *replaces* the whole included
    # table rather than extending it, which would have taken every other asset's
    # Content-Type down with it -- `default_type` in a scoped location only fills
    # in where the table has no entry, so nothing else is touched.
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        # "no-cache" only forces revalidation, not a re-fetch -- a browser that
        # already has this open, or a permissive intermediate proxy, can still
        # serve a stale copy without ever asking the server. "no-store" refuses to
        # keep a cached copy at all, so every load of the shell is a real fetch.
        # The referenced JS/CSS are still content-hashed and cache forever below,
        # so this costs nothing but one small HTML request per visit.
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
