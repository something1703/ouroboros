# SPA fallback: any path nginx can't find as a real file (every client-side route --
# /how-it-works, /docs/architecture, /app/projects/:id) serves index.html instead of
# a bare 404, so React Router's own routing takes over. Static assets keep normal
# caching; index.html is served fresh every time so a redeploy is picked up on next
# load instead of being pinned by a stale cached shell.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
