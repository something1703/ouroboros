    Ouroboros mark: one serpent, tapered from tail to neck, its head closing over
    its own tail so the ring actually reads as closed at every size. Original
    geometry (generated, not traced). The head is fused to the body as a single
    filled silhouette rather than a separate blob, because a detached head-shape
    reads as a stray speck below ~32px; the eye is a true evenodd hole rather
    than a background-coloured dot, so the mark survives on any ground.
